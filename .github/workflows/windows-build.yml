name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install runtime build dependencies
        run: python -m pip install unicorn==2.1.4 ninja==1.13.0
      - name: Build native runtime
        shell: pwsh
        run: |
          cmake -S runtime/mgs_native -B build/runtime -G Ninja -DCMAKE_BUILD_TYPE=Release -DMGS_OUTPUT_DIR="$pwd/package/Oyun"
          cmake --build build/runtime --parallel 4
      - name: Build launcher
        shell: pwsh
        run: ./launcher/build.ps1
      - name: Check community language templates and isolated importer
        shell: pwsh
        run: |
          python tools/check_language_templates.py
          $launcher=Start-Process './package/Metal Gear Solid Mobile.exe' -ArgumentList '--test-language-packs' -Wait -PassThru -WindowStyle Hidden
          if($launcher.ExitCode -ne 0){throw 'Language-pack checks failed'}
      - name: Check bilingual catalogue and native prompts
        shell: pwsh
        run: |
          $launcher=Start-Process './package/Metal Gear Solid Mobile.exe' -ArgumentList '--test-localization' -Wait -PassThru -WindowStyle Hidden
          if($launcher.ExitCode -ne 0){throw 'Launcher catalogue check failed'}
          $env:MGS_PATRIOTS_SELFTEST='1'
          foreach($lang in @('tr','en')){
            Set-Content './package/Oyun/mgs_mobile.ini' "language=$lang" -Encoding utf8
            & './package/Oyun/mgs_mobile.exe'
            if($LASTEXITCODE -ne 0){throw "Native prompt check failed: $lang"}
          }
      - uses: actions/upload-artifact@v4
        with:
          name: patriots-windows-build
          path: |
            package/Metal Gear Solid Mobile.exe
            package/Arayuz/
            package/Oyun/*.exe
            package/Oyun/*.dll
